<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReyCloud Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #030303;
      --bg2: #090909;
      --card: #0d0d0d;
      --card2: #111111;
      --border: rgba(255,255,255,0.06);
      --text: #f4f4f4;
      --soft: #7b7b7b;
      --shadow: 0 8px 30px rgba(0,0,0,0.45);
      --green: #22c55e;
    }

    body {
      background: linear-gradient(180deg, #000000, #040404, #080808);
      color: var(--text);
      min-height: 100vh;
      padding: 22px 18px 40px;
      overflow-x: hidden;
    }

    .container {
      max-width: 430px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
      font-style: italic;
      user-select: none;
      color: white;
    }

    .logo span {
      color: #5d5d5d;
    }

    .menu-btn {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, #111111, #090909);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--shadow);
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .menu-btn:hover {
      transform: scale(1.03);
    }

    .banner {
      width: 100%;
      height: 265px;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .banner video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(1.05) brightness(0.92);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, #0d0d0d, #090909);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 22px 18px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.25s ease;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: white;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.1);
      background: linear-gradient(180deg, #111111, #0b0b0b);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(145deg, #202020, #131313);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      color: white;
    }

    .icon-green {
      background: linear-gradient(145deg, #2ce76f, #18b653);
      color: white;
      border: none;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #f4f4f4;
      line-height: 1.3;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #161616;
      font-size: 11px;
      letter-spacing: 6px;
      font-weight: 700;
      user-select: none;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      top: 0;
      right: -290px;
      width: 270px;
      height: 100%;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255,255,255,0.05);
      padding: 26px 20px;
      transition: 0.3s ease;
      z-index: 999;
      box-shadow: -10px 0 30px rgba(0,0,0,0.45);
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 24px;
      font-weight: 900;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: #d9d9d9;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.03);
      transition: 0.25s ease;
      font-weight: 600;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.06);
      transform: translateX(4px);
      color: white;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      opacity: 0;
      visibility: hidden;
      transition: 0.25s ease;
      z-index: 998;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 420px) {
      .logo {
        font-size: 24px;
      }

      .banner {
        height: 235px;
      }

      .card {
        min-height: 120px;
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <h2>Menu Panel</h2>
    <a href="#">🏠 Dashboard</a>
    <a href="#">🤖 AI Assistant</a>
    <a href="#">📝 Brat Maker</a>
    <a href="#">🖼 Secret Box</a>
    <a href="#">🛒 Order Server</a>
    <a href="#">⚙ Settings</a>
  </div>

  <div class="container">
    <div class="topbar">
      <div class="logo">REY<span>CLOUD</span></div>
      <div class="menu-btn" onclick="toggleSidebar()">☰</div>
    </div>

    <div class="banner">
      <video autoplay muted loop playsinline>
        <source src="https://g.top4top.io/m_3748wj7qn4.mp4" type="video/mp4">
      </video>
    </div>

    <div class="grid">
      <a href="#" class="card">
        <div class="icon-box">◎</div>
        <div class="card-title">AI Assistant</div>
      </a>

      <a href="#" class="card">
        <div class="icon-box">▣</div>
        <div class="card-title">Brat Maker</div>
      </a>

      <a href="#" class="card">
        <div class="icon-box">🖼</div>
        <div class="card-title">Secret Box</div>
      </a>

      <a href="#" class="card">
        <div class="icon-box icon-green">⌁</div>
        <div class="card-title">Order Server</div>
      </a>
    </div>

    <div class="footer">REYCLOUD ECOSYSTEM</div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }
  </script>

</body>
</html>
