<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloud | Dashboard Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #050506; color: #facc15; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        #sidebar { transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); z-index: 1000; }
        #sidebar.open { transform: translateX(0); }
        .menu-item { display: flex; align-items: center; padding: 16px 20px; border-radius: 16px; color: #666; font-weight: 700; transition: 0.3s; cursor: pointer; margin-bottom: 4px; }
        .menu-item:hover, .menu-item.active { background: rgba(250, 204, 21, 0.1); color: #facc15; }
        .creator-glow { text-shadow: 0 0 15px #facc15; }
        .animate-fade { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen">

    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-black border-r border-white/5 p-6 flex flex-col">
        <div class="flex items-center justify-between mb-12">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter">REY<span class="text-white">CLOUD</span></h1>
            <button onclick="toggleSide()" class="md:hidden text-gray-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="flex-grow">
            <div onclick="showPage('home')" class="menu-item active" id="m-home"><i class="fas fa-th-large mr-3"></i> Dashboard</div>
            <div onclick="showPage('buy')" class="menu-item" id="m-buy"><i class="fas fa-shopping-bag mr-3"></i> Buy Panel</div>
            <div onclick="showPage('deposit')" class="menu-item" id="m-deposit"><i class="fas fa-wallet mr-3"></i> Top Up</div>
            <div id="admin-menu" class="hidden mt-6 pt-6 border-t border-white/5">
                <p class="text-[9px] font-black text-gray-600 uppercase tracking-[0.4em] mb-3 ml-4">Owner Only</p>
                <div onclick="showPage('admin')" class="menu-item text-yellow-500" id="m-admin"><i class="fas fa-crown mr-3"></i> Admin Panel</div>
            </div>
        </nav>
        <button onclick="logout()" class="menu-item text-red-500 mt-auto"><i class="fas fa-power-off mr-3"></i> Logout</button>
    </div>

    <div class="min-h-screen">
        <nav class="p-4 glass sticky top-0 flex justify-between items-center z-50 border-b border-white/5">
            <button onclick="toggleSide()" class="w-10 h-10 rounded-xl bg-white/5 text-yellow-500"><i class="fas fa-bars"></i></button>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p id="u-name" class="text-white font-black text-sm italic uppercase">Loading...</p>
                    <p id="u-role" class="text-[9px] font-bold text-gray-500 uppercase">Member</p>
                </div>
                <div id="pfp" class="w-11 h-11 rounded-xl bg-yellow-500 flex items-center justify-center text-black font-black text-xl">R</div>
            </div>
        </nav>

        <div id="page-container" class="p-6 max-w-6xl mx-auto">
            
            <div id="p-home" class="animate-fade space-y-6">
                <div class="glass p-8 rounded-[2.5rem] border-l-4 border-yellow-500 relative overflow-hidden group">
                    <h2 class="text-3xl font-black italic text-white uppercase">Welcome, <br><span class="text-yellow-500" id="w-name">REY</span>!</h2>
                    <div class="flex items-center mt-6 bg-black/40 w-fit px-4 py-2 rounded-full border border-white/10">
                        <i class="fas fa-wallet text-yellow-500 mr-3"></i>
                        <p id="u-bal" class="text-white font-black tracking-widest text-sm">Rp 0</p>
                    </div>
                    <i class="fas fa-bolt absolute -right-6 -bottom-6 text-[10rem] text-white/5 -rotate-12 group-hover:scale-110 transition-transform"></i>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="showPage('deposit')" class="bg-yellow-500 p-6 rounded-3xl text-black font-black uppercase text-xs italic hover:brightness-110 transition-all">Top Up Saldo</button>
                    <button onclick="showPage('buy')" class="glass p-6 rounded-3xl text-white font-black uppercase text-xs italic border border-white/10 hover:bg-white/5 transition-all">Beli Panel</button>
                </div>
            </div>

            <div id="p-buy" class="hidden animate-fade grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-8 rounded-[2rem] border border-white/5 hover:border-yellow-500/50 transition-all">
                    <i class="fab fa-node-js text-4xl text-yellow-500 mb-4"></i>
                    <h4 class="text-xl font-black text-white italic uppercase">NodeJS Panel 1GB</h4>
                    <p class="text-yellow-500 font-bold mb-6">Rp 5.000 / Bulan</p>
                    <button onclick="buyProduct('NodeJS 1GB', 5000)" class="w-full bg-white/5 border border-white/10 py-4 rounded-2xl font-black text-xs uppercase hover:bg-yellow-500 hover:text-black transition-all">Order Now</button>
                </div>
            </div>

            <div id="p-deposit" class="hidden animate-fade">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass p-8 rounded-[2.5rem] border border-white/5">
                        <p class="text-[10px] font-bold text-gray-500 uppercase mb-4">Input Nominal</p>
                        <input id="depo-amount" type="number" placeholder="Min 5000" class="w-full bg-black/50 border border-white/10 p-5 rounded-2xl text-white font-black outline-none focus:border-yellow-500 mb-6">
                        <button onclick="prosesDeposit()" class="w-full bg-yellow-500 py-5 rounded-3xl text-black font-black uppercase tracking-widest hover:brightness-110 transition-all">Bayar via QRIS</button>
                    </div>
                    <div id="depo-info" class="glass p-8 rounded-[2.5rem] border border-yellow-500/20 flex flex-col items-center justify-center text-center">
                        <i class="fas fa-qrcode text-6xl text-gray-800 mb-4"></i>
                        <p class="text-xs font-bold text-gray-600 uppercase">Invoice akan muncul di sini</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        let checkInterval;

        // DATA CONSTANTS (SESUAIKAN)
        const PAKASIR_API_KEY = "9AwCqt0h99ArK0Jy7R5PYpP1FmdQ0SWN"; // Gantilah Bos!
        const PAKASIR_PROJECT = "reyclouddev"; // Gantilah Bos!

        async function syncUserData() {
            const localData = JSON.parse(localStorage.getItem('currentUser'));
            if (!localData) return window.location.href = 'index.html';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: localData.username, password: localData.password || "1903", type: 'login' })
                });
                const data = await res.json();
                if (data.status) {
                    const user = data.user;
                    document.getElementById('u-name').innerText = user.username;
                    document.getElementById('w-name').innerText = user.username;
                    document.getElementById('u-bal').innerText = "Rp " + user.balance.toLocaleString('id-ID');
                    document.getElementById('u-role').innerText = user.role;
                    if (user.role === 'Creator') document.getElementById('admin-menu').classList.remove('hidden');
                }
            } catch (e) { console.log("Offline Mode"); }
        }

        async function prosesDeposit() {
            const amount = document.getElementById('depo-amount').value;
            const infoBox = document.getElementById('depo-info');
            if (!amount || amount < 5000) return alert("Min Rp 5.000!");

            infoBox.innerHTML = `<p class="animate-pulse text-yellow-500 font-black">GENERATING QRIS...</p>`;

            try {
                const res = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, method: 'qris' })
                });
                const data = await res.json();
                if (data.status) {
                    infoBox.innerHTML = `
                        <div class="animate-fade">
                            <p class="text-[10px] font-black text-yellow-500 uppercase mb-4">Scan & Bayar</p>
                            <div class="bg-white p-2 rounded-xl mb-4 inline-block"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data.payment.payment_number}" class="w-48 h-48"></div>
                            <p class="text-white font-black">Total: Rp ${data.payment.total_payment.toLocaleString()}</p>
                            <p class="text-[9px] text-green-500 animate-pulse mt-2 font-black uppercase tracking-widest">Checking Payment Status...</p>
                        </div>`;
                    startPolling(data.order_id, amount);
                }
            } catch (e) { alert("API Error"); }
        }

        function startPolling(orderId, amount) {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(async () => {
                try {
                    const res = await fetch(`https://app.pakasir.com/api/transactiondetail?project=${PAKASIR_PROJECT}&amount=${amount}&order_id=${orderId}&api_key=${PAKASIR_API_KEY}`);
                    const data = await res.json();
                    if (data.transaction && data.transaction.status === 'completed') {
                        clearInterval(checkInterval);
                        alert("Deposit Sukses!");
                        syncUserData(); // Refresh Saldo
                        showPage('home');
                    }
                } catch (e) {}
            }, 5000);
        }

        async function buyProduct(name, price) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user.balance < price) return alert("Saldo Kurang!");
            if (confirm(`Beli ${name}?`)) {
                // Logic potong saldo via API
                alert(`Berhasil beli ${name}!`);
            }
        }

        function toggleSide() { sidebar.classList.toggle('open'); }
        function showPage(p) {
            document.querySelectorAll('#page-container > div').forEach(d => d.classList.add('hidden'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('p-' + p).classList.remove('hidden');
            document.getElementById('m-' + p).classList.add('active');
            if (window.innerWidth < 768) toggleSide();
        }
        function logout() { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; }
        window.onload = syncUserData;
    </script>
</body>
</html>
