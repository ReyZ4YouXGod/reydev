<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloud | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050506; color: #facc15; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        #sidebar { transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); z-index: 1000; }
        #sidebar.open { transform: translateX(0); }
        .menu-item { display: flex; align-items: center; padding: 16px 20px; border-radius: 16px; color: #666; font-weight: 700; transition: 0.3s; cursor: pointer; margin-bottom: 4px; }
        .menu-item:hover, .menu-item.active { background: rgba(250, 204, 21, 0.1); color: #facc15; }
        .menu-item i { width: 24px; font-size: 18px; margin-right: 12px; }
        .creator-glow { text-shadow: 0 0 15px #facc15; }
    </style>
</head>
<body class="min-h-screen">

    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-black border-r border-white/5 p-6 flex flex-col">
        <div class="flex items-center justify-between mb-12">
            <h1 class="text-2xl font-black italic uppercase">REY<span class="text-white">CLOUD</span></h1>
            <button onclick="toggleSide()" class="md:hidden text-gray-500"><i class="fas fa-times"></i></button>
        </div>

        <nav class="flex-grow">
            <div onclick="showPage('home')" class="menu-item active" id="m-home"><i class="fas fa-th-large"></i> Dashboard</div>
            <div onclick="showPage('buy')" class="menu-item" id="m-buy"><i class="fas fa-shopping-bag"></i> Buy Panel</div>
            
            <div class="h-[1px] bg-white/5 my-6"></div>
            
            <div id="admin-menu" class="hidden space-y-1">
                <p class="text-[9px] font-black text-gray-600 uppercase tracking-[0.4em] mb-3 ml-4">Management</p>
                <div onclick="showPage('admin')" class="menu-item text-yellow-500" id="m-admin"><i class="fas fa-crown"></i> Admin Panel</div>
            </div>
        </nav>

        <div class="pt-6 border-t border-white/5">
            <button onclick="logout()" class="menu-item text-red-500 w-full hover:bg-red-500/10"><i class="fas fa-power-off"></i> Logout Account</button>
        </div>
    </div>

    <div class="min-h-screen">
        <nav class="p-4 glass sticky top-0 flex justify-between items-center z-50 border-b border-white/5">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSide()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 text-yellow-500"><i class="fas fa-bars"></i></button>
                <h2 class="font-black italic text-white uppercase tracking-tighter hidden md:block">Control Panel</h2>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p id="u-name" class="text-white font-black text-sm leading-none italic uppercase">User</p>
                    <p id="u-role" class="text-[9px] font-bold text-gray-500 uppercase mt-1">Member</p>
                </div>
                <div id="pfp" class="w-10 h-10 rounded-xl bg-yellow-500 flex items-center justify-center text-black font-black">R</div>
            </div>
        </nav>

        <div id="page-container" class="p-6 max-w-6xl mx-auto">
            <div id="p-home" class="space-y-6">
                <div class="glass p-8 rounded-[2rem] border-l-4 border-yellow-500 relative overflow-hidden">
                    <h2 class="text-3xl font-black italic text-white uppercase leading-none">Welcome Back, <br><span class="text-yellow-500" id="w-name">REYCLOUD</span>!</h2>
                    <p class="text-gray-500 text-xs mt-4 uppercase font-bold tracking-widest">Saldo Anda: <span class="text-white" id="u-bal">Rp 0</span></p>
                    <i class="fas fa-bolt absolute -right-4 -bottom-4 text-9xl text-white/5 -rotate-12"></i>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="glass p-6 rounded-3xl border border-white/5">
                        <p class="text-[10px] font-bold text-gray-500 uppercase mb-2">Server Status</p>
                        <h3 class="text-xl font-black italic text-white uppercase">No Active Server</h3>
                    </div>
                    <button onclick="showPage('buy')" class="bg-yellow-500 p-6 rounded-3xl text-black flex items-center justify-between group">
                        <span class="font-black italic uppercase">Beli Server Sekarang</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-2 transition"></i>
                    </button>
                </div>
            </div>

            <div id="p-buy" class="hidden animate-fade-in">
                <h3 class="text-xl font-black italic text-white uppercase mb-6"><i class="fas fa-shopping-cart text-yellow-500 mr-2"></i> Pterodactyl Store</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="glass p-6 rounded-3xl border border-white/10 hover:border-yellow-500 transition-all group">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-yellow-500"><i class="fab fa-node-js text-2xl"></i></div>
                            <span class="text-[10px] font-black bg-yellow-500 text-black px-2 py-1 rounded-lg">BEST SELLER</span>
                        </div>
                        <h4 class="text-xl font-black text-white italic uppercase">NodeJS Panel 1GB</h4>
                        <p class="text-xs text-gray-500 mt-1 uppercase font-bold">Rp 5.000 / Bulan</p>
                        <button class="w-full mt-6 bg-white/5 border border-white/10 py-3 rounded-2xl font-black text-xs uppercase hover:bg-yellow-500 hover:text-black transition-all">Order Now</button>
                    </div>
                </div>
            </div>

            <div id="p-admin" class="hidden animate-fade-in">
                <h3 class="text-xl font-black italic text-yellow-500 uppercase mb-6 creator-glow"><i class="fas fa-crown mr-2"></i> Command Center</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="glass p-6 rounded-3xl border-b-4 border-purple-500">
                        <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Total Members</p>
                        <h3 id="adm-member" class="text-4xl font-black italic text-white
