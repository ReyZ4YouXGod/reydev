<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloud | Entrance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050506; color: #facc15; font-family: 'Inter', sans-serif; }
        .neon-border { border: 1px solid #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.2); }
        .glass-auth { background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { background: #facc15; color: #000; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        input { transition: 0.3s; background: rgba(0,0,0,0.6) !important; }
        input:focus { border-color: #facc15 !important; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    
    <div class="glass-auth p-8 rounded-[2.5rem] w-full max-w-[400px] neon-border">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black italic tracking-tighter uppercase">REY<span class="text-white">CLOUD</span></h1>
            <p class="text-[9px] tracking-[0.4em] font-bold text-gray-500 uppercase mt-2">Digital Hosting Store</p>
        </div>

        <div class="flex bg-white/5 p-1 rounded-2xl mb-8">
            <button id="btn-l" onclick="setMode('login')" class="flex-1 py-3 rounded-xl font-black text-xs transition-all tab-active">LOGIN</button>
            <button id="btn-r" onclick="setMode('reg')" class="flex-1 py-3 rounded-xl font-black text-xs transition-all text-gray-500">REGIS</button>
        </div>

        <div class="space-y-4">
            <div class="relative group">
                <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-yellow-500 transition"></i>
                <input id="user" type="text" placeholder="Username" class="w-full border border-white/10 p-4 pl-14 rounded-2xl outline-none text-white text-sm">
            </div>
            
            <div class="relative group">
                <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-yellow-500 transition"></i>
                <input id="pass" type="password" placeholder="Password" class="w-full border border-white/10 p-4 pl-14 rounded-2xl outline-none text-white text-sm">
            </div>

            <div id="extra-reg" class="hidden animate-fade-in">
                <div class="relative">
                    <i class="fas fa-shield-alt absolute left-5 top-1/2 -translate-y-1/2 text-gray-600 text-sm"></i>
                    <input id="pass-conf" type="password" placeholder="Confirm Password" class="w-full border border-white/10 p-4 pl-14 rounded-2xl outline-none text-white text-sm">
                </div>
            </div>

            <button onclick="handleAuth()" id="btn-main" class="w-full bg-yellow-500 py-4 rounded-2xl text-black font-black italic uppercase tracking-widest hover:scale-[0.98] transition-all mt-4">
                Enter ReyCloud
            </button>
        </div>

        <p id="msg" class="text-center text-[10px] font-black uppercase mt-6 text-red-500 tracking-widest min-h-[15px]"></p>
    </div>

    <script>
        let mode = 'login';

        function setMode(m) {
            mode = m;
            document.getElementById('btn-l').className = m === 'login' ? 'flex-1 py-3 rounded-xl font-black text-xs transition-all tab-active' : 'flex-1 py-3 rounded-xl font-black text-xs transition-all text-gray-500';
            document.getElementById('btn-r').className = m === 'reg' ? 'flex-1 py-3 rounded-xl font-black text-xs transition-all tab-active' : 'flex-1 py-3 rounded-xl font-black text-xs transition-all text-gray-500';
            document.getElementById('extra-reg').classList.toggle('hidden', m === 'login');
            document.getElementById('btn-main').innerText = m === 'login' ? 'Enter ReyCloud' : 'Create Account';
        }

        async function handleAuth() {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const passConf = document.getElementById('pass-conf').value;
            const msg = document.getElementById('msg');

            if (mode === 'reg' && password !== passConf) {
                msg.innerText = "Password tidak cocok!";
                return;
            }

            try {
                const res = await fetch('/api/auth.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, type: mode })
                });
                const data = await res.json();

                if (data.status) {
                    if (mode === 'login') {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                        window.location.href = 'dashboard.html';
                    } else {
                        alert("Berhasil Daftar!");
                        setMode('login');
                    }
                } else {
                    msg.innerText = data.message;
                }
            } catch (e) { msg.innerText = "Server Error!"; }
        }
    </script>
</body>
</html>
