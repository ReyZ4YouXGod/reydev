<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloud | Entrance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050506; color: #facc15; font-family: 'Inter', sans-serif; }
        .neon-border { border: 1px solid #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.2); }
        .glass-auth { background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        input { transition: 0.3s; background: rgba(0,0,0,0.6) !important; }
        input:focus { border-color: #facc15 !important; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }
        .btn-glow { box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    
    <div class="glass-auth p-10 rounded-[2.5rem] w-full max-w-[400px] neon-border">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black italic tracking-tighter uppercase leading-none">REY<span class="text-white">CLOUD</span></h1>
            <div class="h-1 w-20 bg-yellow-500 mx-auto mt-2 rounded-full"></div>
            <p class="text-[9px] tracking-[0.5em] font-bold text-gray-500 uppercase mt-4">Authorized Personnel Only</p>
        </div>

        <div class="space-y-6">
            <div class="relative group">
                <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-yellow-500 transition"></i>
                <input id="user" type="text" placeholder="Username" 
                       class="w-full border border-white/10 p-5 pl-14 rounded-2xl outline-none text-white text-sm font-medium">
            </div>
            
            <div class="relative group">
                <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-yellow-500 transition"></i>
                <input id="pass" type="password" placeholder="Password" 
                       class="w-full border border-white/10 p-5 pl-14 rounded-2xl outline-none text-white text-sm font-medium">
            </div>

            <button onclick="handleLogin()" class="w-full bg-yellow-500 py-5 rounded-2xl text-black font-black italic uppercase tracking-[0.2em] hover:scale-[0.97] active:scale-95 transition-all btn-glow mt-4">
                Enter ReyCloud <i class="fas fa-bolt ml-2"></i>
            </button>
        </div>

        <p id="msg" class="text-center text-[10px] font-black uppercase mt-8 text-red-500 tracking-widest min-h-[15px]"></p>
        
        <div class="mt-8 text-center">
            <p class="text-[8px] text-gray-700 font-bold uppercase tracking-widest">© 2026 REYCLOUD STORE DEVS</p>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const msg = document.getElementById('msg');

            if (!username || !password) {
                msg.innerText = "Isi semua kolom, Bos! 😈";
                return;
            }

            msg.innerText = "Authenticating...";
            msg.classList.remove('text-red-500');
            msg.classList.add('text-yellow-500');

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, type: 'login' })
                });
                
                const data = await res.json();

                if (data.status) {
                    msg.innerText = "Access Granted! Redirecting...";
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    msg.innerText = data.message || "Gagal Login!";
                    msg.classList.remove('text-yellow-500');
                    msg.classList.add('text-red-500');
                }
            } catch (e) { 
                msg.innerText = "Server Error! Cek API Vercel."; 
                msg.classList.remove('text-yellow-500');
                msg.classList.add('text-red-500');
            }
        }

        // Shortcut Enter Key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
